<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Doodle Jump</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Der Wrapper wird per JavaScript auf die Fenstergrösse skaliert (Hochformat 2:3) -->
  <canvas id="backdrop"></canvas>
  <div id="game-wrapper">
    <canvas id="game"></canvas>

    <!-- Kleine Knöpfe für Handy-Spieler (Desktop: Tasten P und M) -->
    <div id="hud-buttons">
      <button id="btn-pause" type="button" tabindex="-1" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g class="i-pause"><rect x="6" y="5" width="4.2" height="14" rx="1.5"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.5"/></g>
          <path class="i-play" d="M8 5.5v13l11-6.5z"/>
        </svg>
      </button>
      <button id="btn-mute" type="button" tabindex="-1" aria-label="Ton an/aus">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z"/>
          <path class="i-wave" fill="none" stroke-width="2" d="M16 8.5a5 5 0 0 1 0 7M18.8 5.8a9 9 0 0 1 0 12.4"/>
          <path class="i-x" fill="none" stroke-width="2" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
    </div>

    <!-- Startbildschirm -->
    <div id="screen-start" class="screen">
      <h1>Doodle Jump</h1>
      <div class="chips">
        <span class="chip gold"><i class="coin-dot"></i><b id="chip-coins">0</b></span>
        <span class="chip" id="chip-abil">Fähigkeit: keine</span>
      </div>
      <button id="btn-play" class="btn-play" type="button" tabindex="-1">Spielen</button>
      <div class="btn-row">
        <button id="btn-skins" class="btn-small" type="button" tabindex="-1">Skins</button>
        <button id="btn-shop" class="btn-small" type="button" tabindex="-1">Shop</button>
      </div>
      <div class="controls">
        <span class="ctrl-label">Tastatur</span>
        <span class="ctrl-items">
          <span class="keys"><kbd>←</kbd><kbd>→</kbd></span>
          <span class="ctrl-or">oder</span>
          <span class="keys"><kbd>A</kbd><kbd>D</kbd></span>
        </span>
        <span class="ctrl-label">Handy</span>
        <span class="ctrl-items">
          <span class="phone"><span>links</span><span>rechts</span></span>
          <span class="ctrl-note">tippen</span>
        </span>
      </div>
    </div>

    <!-- Pause -->
    <div id="screen-pause" class="screen hidden">
      <div class="pause-icon"><i></i><i></i></div>
      <h2>Pause</h2>
      <div class="chips">
        <span class="chip">Score <b id="pause-score">0</b></span>
        <span class="chip gold"><i class="coin-dot"></i><b id="pause-coins">0</b></span>
      </div>
      <span class="chip" id="pause-abil">Fähigkeit: keine</span>
      <button id="btn-resume" class="btn-play" type="button" tabindex="-1">Weiter</button>
      <button id="btn-skins-pause" class="btn-small" type="button" tabindex="-1">Skins</button>
      <p class="hint">P oder Tippen zum Weiterspielen</p>
    </div>

    <!-- Game Over -->
    <div id="screen-over" class="screen hidden">
      <h2>Game Over</h2>
      <div class="score-card">
        <span class="score-label">Score</span>
        <span class="score-big" id="final-score">0</span>
        <div class="score-row"><span>Highscore</span><b id="final-best">0</b></div>
      </div>
      <p id="new-record" class="record hidden">Neuer Highscore!</p>
      <p id="new-skin" class="record hidden"></p>
      <div class="chips">
        <span class="chip gold"><i class="coin-dot"></i>+<b id="over-gain">0</b></span>
        <span class="chip">Gesamt <b id="over-total">0</b></span>
      </div>
      <p id="over-progress" class="small"></p>
      <button id="btn-restart" type="button">Nochmal spielen</button>
      <div class="btn-row">
        <button id="btn-skins-over" class="btn-small" type="button" tabindex="-1">Skins</button>
        <button id="btn-shop-over" class="btn-small" type="button" tabindex="-1">Shop</button>
      </div>
    </div>

    <!-- Skin-Auswahl -->
    <div id="screen-skins" class="screen hidden">
      <h2>Skins</h2>
      <p id="skin-total" class="skin-total"></p>
      <p id="skin-progress" class="small"></p>
      <div id="skin-bar"><div id="skin-bar-fill"></div></div>
      <div id="skin-grid"></div>
      <button id="btn-skins-close" class="btn-small" type="button" tabindex="-1">Zurück</button>
    </div>

    <!-- Shop -->
    <div id="screen-shop" class="screen hidden">
      <h2>Shop</h2>
      <div id="shop-coins" class="chip gold big"><i class="coin-dot"></i><b id="shop-coin-num">0</b></div>
      <div id="shop-tabs">
        <button id="tab-abil" class="btn-small" type="button" tabindex="-1">Fähigkeiten</button>
        <button id="tab-paper" class="btn-small" type="button" tabindex="-1">Papier</button>
        <button id="tab-skin" class="btn-small" type="button" tabindex="-1">Skins</button>
      </div>
      <p id="shop-hint" class="small"></p>
      <div id="shop-grid"></div>
      <button id="btn-shop-close" class="btn-small" type="button" tabindex="-1">Zurück</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
